name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "::error::these files are not gofmt-formatted:"
            echo "${unformatted}"
            exit 1
          fi
      # Runs the linters and formatters configured in .golangci.yml
      # against the whole module. This also covers go vet: golangci-lint's
      # govet linter is part of the enabled default set. version-file
      # reads the pinned version from .golangci-lint-version, the same
      # file `make lint` reads, so the two can't drift.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version
      - name: go vet
        run: go vet ./...
      # Lints the workflow files themselves (syntax, expression errors,
      # shellcheck on `run:` blocks - shellcheck is preinstalled on
      # ubuntu-latest). Same binary as `make actionlint`, via the tool
      # dependency in go.mod.
      - name: actionlint
        run: go tool actionlint
      # Every shell or OpenRC script under hack/ and images/, found by its
      # shebang (the same selection `make shellcheck` makes).
      - name: shellcheck
        run: ./hack/shellcheck.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # -race runs every test under the race detector; it needs cgo, which
      # the hosted runners have.
      - name: go test
        run: go test -race ./...

  # Builds every image into a local registry exactly as the release does,
  # builds it a second time without the cache to check the digests are
  # reproducible, and runs the registry tests against the result.
  images:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The builder runs in a container; the host network lets it reach the
      # registry service on localhost:5000.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
      - name: Build every image
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          for dir in images/*/; do
            ./hack/build-image.sh \
              --prefix localhost:5000/contemper-project \
              --image-dir "${dir}" \
              --tag ci \
              --revision "${REVISION}" \
              --insecure \
              --digests-file "${RUNNER_TEMP}/digests-1.txt"
          done
      - name: Build again and compare the digests
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          for dir in images/*/; do
            ./hack/build-image.sh \
              --prefix localhost:5000/contemper-project \
              --image-dir "${dir}" \
              --tag ci \
              --revision "${REVISION}" \
              --insecure \
              --no-cache \
              --digests-file "${RUNNER_TEMP}/digests-2.txt"
          done
          if ! diff -u "${RUNNER_TEMP}/digests-1.txt" "${RUNNER_TEMP}/digests-2.txt"; then
            echo "::error::building the images twice gave different digests"
            exit 1
          fi
          cat "${RUNNER_TEMP}/digests-1.txt"
      - name: Check the built images
        env:
          IMAGETEST_REGISTRY: localhost:5000/contemper-project
          IMAGETEST_TAG: ci
        run: go test -count=1 -v ./internal/imagetest

  # Every commit on a PR (not just its title) is checked against
  # Conventional Commits, since PRs are rebase-merged and release-please
  # parses each commit individually, and against the DCO (see
  # CONTRIBUTING.md). Nothing to check outside a PR.
  commit-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check commit subjects are Conventional Commits
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|perf|deps|docs|refactor|test|build|ci|chore|revert)(\([a-z0-9,/ -]+\))?!?: .+'
          # Full history (the checkout above has fetch-depth: 0): a
          # --depth=1 fetch would graft the base branch, so a PR based on an
          # older base commit would list every commit in the repository.
          git fetch --no-tags origin "$BASE_REF"
          status=0
          while IFS= read -r sha; do
            subject="$(git log -1 --format=%s "$sha")"
            if [[ "$subject" =~ $pattern ]]; then
              echo "ok:      $sha $subject"
            else
              echo "::error::commit $sha is not a Conventional Commit: $subject"
              status=1
            fi
          done < <(git rev-list --no-merges "origin/${BASE_REF}..${HEAD_SHA}")
          exit "$status"
      - name: Check commits are signed off (DCO)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r sha; do
            name="$(git log -1 --format=%an "$sha")"
            email="$(git log -1 --format=%ae "$sha")"
            subject="$(git log -1 --format=%s "$sha")"

            # Bot-authored commits (Renovate, release-please via
            # GITHUB_TOKEN) can't sign off on their own account; skip them.
            if [[ "$email" == *"[bot]@users.noreply.github.com" ]]; then
              echo "skip (bot author): $sha $email"
              continue
            fi

            trailers="$(git log -1 --format=%B "$sha" | git interpret-trailers --parse)"
            expected="Signed-off-by: ${name} <${email}>"
            if grep -qF "$expected" <<<"$trailers"; then
              echo "ok:                $sha $expected"
            else
              echo "::error::commit $sha ($subject) has no '$expected' trailer"
              status=1
            fi
          done < <(git rev-list --no-merges "origin/${BASE_REF}..${HEAD_SHA}")
          if [ "$status" -ne 0 ]; then
            echo "::error::fix with: git rebase --signoff origin/${BASE_REF}, then force-push"
          fi
          exit "$status"

  # The generated Incus files in images/incus-support must be what
  # hack/sync-incus-agent.sh produces from the pinned Incus release. This
  # fails on a pin bump (a Renovate PR, say) whose files weren't regenerated,
  # and on hand edits of the generated files.
  incus-agent-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regenerate the Incus agent files
        run: ./hack/sync-incus-agent.sh
      - name: Check they are unchanged
        run: |
          if ! git diff --exit-code; then
            echo "::error::images/incus-support differs from what hack/sync-incus-agent.sh generates from images/incus-support/incus-agent.pin. Run ./hack/sync-incus-agent.sh and commit the result; do not edit the generated files by hand."
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::hack/sync-incus-agent.sh produced files that are not committed. Run ./hack/sync-incus-agent.sh and commit the result."
            exit 1
          fi

  ci-result:
    # The one check to mark required in the ruleset instead of any job
    # above. A matrix job reports one check per combination ("test
    # (ubuntu-latest)"), and a job skipped by its `if:` reports under its
    # bare name; a rule requiring any of those by name could wait forever.
    # This job always runs under a stable name and succeeds whenever every
    # job it depends on is either "success" or "skipped" (commit-checks is
    # skipped outside pull requests).
    needs: [lint, test, images, commit-checks, incus-agent-sync]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check whether any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
